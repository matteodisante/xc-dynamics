# Thresholds of the pre-processing (thesis, chapter "Trajectory pre-processing").

altitude:
  gnss_present_min: 0.95  # share of fixes with a GNSS altitude
  gnss_min_range_m: 30.0  # a flatter channel is stuck, or the flight barely moved
  baro_witness_present_min: 0.95
  baro_witness_min_range_m: 30.0
  # The pressure range must be within this share of the GNSS range: further off, the
  # field is not an altitude in metres.
  baro_witness_range_tolerance: 0.1

speed:  # horizontal speed between consecutive fixes
  max_kmh:  # top speed of the discipline: a faster step is a recorder error
    para: 100.0
    hang: 175.0
  median_max_kmh:  # a flight with a faster median step speed is not a free flight
    para: 70.0
    hang: 110.0

excursion:  # excursions, horizontal and vertical
  window_s: 20.0  # W: a block that does not rejoin within W splits the flight
  # Half and twice W, only to count how much the splits depend on W.
  window_short_s: 10.0
  window_long_s: 40.0

vertical:  # vertical speed of the GNSS altitude between fixes
  max_ms:  # top vertical speed of the discipline: a faster step is a recorder error
    para: 30.0
    hang: 20.0
