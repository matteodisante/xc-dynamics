[project]
name = "xc-dynamics"
version = "0.1.0"
description = "Analysis of cross-country soaring flights."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.15",
    "pandas>=2.2",
    "pyyaml>=6.0.3",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
